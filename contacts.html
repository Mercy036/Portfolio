<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Ansh Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="contacts.css" />
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-link">HOME</a>
            <a href="projects.html" class="nav-link">PROJECTS</a>
            <a href="contacts.html" class="nav-link active">CONTACT</a>
        </div>
    </nav>
    
    <div class="main-container">
        <!-- Contact Cards -->
        <div class="contact-cards">
            <div class="contact-card email animate-scaleIn delay-100">
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=anshmahajan2006@gmail.com" target="_blank" class="mail-link" aria-label="Email Link">
                    <img src="assets\mail-alt-3-svgrepo-com.svg" alt="Email" class="Email-icon" />
                </a>
            </div>
            
            <div class="contact-card linkedin animate-fadeInRight delay-200">
                <a href="https://www.linkedin.com/in/ansh-mahajan-46115a267/" target="_blank" class="linkedin-link" aria-label="LinkedIn Link">
                    <img src="assets\linkedin-161-svgrepo-com.svg" alt="LinkedIn" class="linkedin-icon" />
                </a>
            </div>
            
            <div class="contact-card github animate-fadeInUp delay-300">
                <a href="https://github.com/Mercy036" target="_blank" class="github-link" aria-label="GitHub Link">
                    <img src="assets\github-svgrepo-com.svg" alt="GitHub" class="github-icon" />
                </a>
                <span class="github-text">GitHub</span>
                <span class="github-username">Find more of my repositories</span>
            </div>
        </div>

        <!-- Contact Form -->
        <h2 class="contact-title animate-fadeInUp delay-400">CONTACT ME</h2>
        <form class="contact-form animate-fadeInUp delay-500">
            <input type="text" placeholder="Your Name" required class="animate-fadeInLeft delay-600" />
            <input type="email" placeholder="Your Email" required class="animate-fadeInRight delay-700" />
            <textarea placeholder="Your Message" required class="animate-fadeInLeft delay-800"></textarea>
            <button type="submit" class="animate-fadeInUp delay-900">SEND MESSAGE</button>
        </form>
    </div>

    <script>
        // Page load animation trigger
        window.addEventListener('load', function() {
            document.body.classList.add('page-loaded');
        });

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animationPlayState = 'running';
                }
            });
        }, observerOptions);

        // Observe all animated elements
        document.addEventListener('DOMContentLoaded', function() {
            const animatedElements = document.querySelectorAll('[class*="animate-"]');
            animatedElements.forEach(el => {
                observer.observe(el);
            });
        });

        // Enhanced form handling with animations
        document.querySelector('.contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const button = this.querySelector('button');
            const originalText = button.textContent;
            
            // Loading animation
            button.textContent = 'SENDING...';
            button.style.background = 'linear-gradient(135deg, #f59e0b, #f97316)';
            button.disabled = true;
            
            // Simulate form submission (replace with actual form handling)
            setTimeout(() => {
                // Success animation
                button.textContent = 'MESSAGE SENT!';
                button.classList.add('success');
                
                // Reset after 2 seconds
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('success');
                    button.disabled = false;
                    button.style.background = '';
                    this.reset();
                }, 2000);
            }, 1500);
        });

        // Enhanced hover effects for contact cards
        document.querySelectorAll('.contact-card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                // Add subtle vibration effect
                this.style.animation = 'pulse 0.6s ease-in-out';
            });
            
            card.addEventListener('mouseleave', function() {
                this.style.animation = '';
            });
        });

        // Smooth scrolling for better UX
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Add typing animation to form inputs
        document.querySelectorAll('.contact-form input, .contact-form textarea').forEach(input => {
            input.addEventListener('focus', function() {
                this.style.transform = 'translateY(-2px) scale(1.02)';
                this.style.boxShadow = '0 8px 25px rgba(96, 165, 250, 0.15)';
            });
            
            input.addEventListener('blur', function() {
                this.style.transform = '';
                this.style.boxShadow = '';
            });
        });

        // Add particle effect on contact card click (optional enhancement)
        document.querySelectorAll('.contact-card').forEach(card => {
            card.addEventListener('click', function(e) {
                // Create ripple effect
                const ripple = document.createElement('div');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.cssText = `
                    position: absolute;
                    border-radius: 50%;
                    background: rgba(255, 255, 255, 0.3);
                    transform: scale(0);
                    animation: ripple 0.6s linear;
                    width: ${size}px;
                    height: ${size}px;
                    left: ${x}px;
                    top: ${y}px;
                    pointer-events: none;
                `;
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // Add CSS for ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(2);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
